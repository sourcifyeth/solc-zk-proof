[package]
name = "solc-zk-proof"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
sp1-sdk = { version = "6.10.0", features = ["blocking", "network"] }
sp1-verifier = "6.10.0"
alloy-primitives = { version = "1.3", features = ["serde"] }
alloy-sol-types = "1.3"
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "3", features = ["json"] }
anyhow = "1"
solc-zk-proof-claim = { path = "../guest/claim" }
